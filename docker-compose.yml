version: '3.8'
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    ports:
      - '3000:3000' # Expose your API Gateway service on a different port (3001)
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: yarn start:api-gateway # Adjust for your app's entry point
    env_file:
      - .env.development # Load environment variables from the .env.development file
    depends_on:
      rmq:
        condition: service_healthy

  order-management:
    build:
      context: .
      dockerfile: Dockerfile.order-management
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: yarn start:order-management
    dns:
      - 8.8.8.8
    env_file:
      - .env.development
    depends_on:
      rmq:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile.customer-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: yarn start:customer-service
    env_file:
      - .env.development
    depends_on:
      rmq:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.inventory-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: yarn start:inventory-service
    env_file:
      - .env.development
    depends_on:
      rmq:
        condition: service_healthy

  rmq:
    image: rabbitmq:3-management
    ports:
      - '5673:5672' # Avoid conflict with local RabbitMQ
      - '15673:15672' # Management UI on a different port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
